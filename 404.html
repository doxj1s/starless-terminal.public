<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 // Signal Lost — Starless Terminal</title>

  <meta
    name="description"
    content="Signal lost. The requested location could not be found."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #0b0d0e;
      color: #d7ded9;

      font-family:
        "Courier New",
        Courier,
        monospace;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 32px;
    }

    main {
      width: 100%;
      max-width: 760px;
    }

    .prompt {
      color: #6fa78a;
      margin-bottom: 12px;
    }

    .error-code {
      color: #56605a;
      margin-bottom: 8px;
      letter-spacing: 0.15em;
    }

    h1 {
      margin: 0 0 24px;

      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.05em;

      color: #f1f4f2;
    }

    .message {
      color: #89938d;
      line-height: 1.8;
      max-width: 620px;
    }

    .message strong {
      color: #b8c2bc;
      font-weight: normal;
    }

    .divider {
      border: 0;
      border-top: 1px solid #252a27;

      margin: 40px 0;
    }

    .status {
      color: #56605a;
      line-height: 1.8;
    }

    .return {
      display: inline-block;

      margin-top: 40px;

      color: #6fa78a;
      text-decoration: none;
    }

    .return:hover,
    .return:focus {
      color: #a3c7b3;
    }

    .cursor {
      display: inline-block;

      width: 9px;
      height: 1em;

      margin-left: 4px;

      background: #6fa78a;

      vertical-align: -2px;

      animation: blink 1.1s steps(1) infinite;
    }

    footer {
      margin-top: 64px;

      color: #414844;
      font-size: 0.8rem;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>

    <div class="prompt">
          </div>

    <div class="error-code">
      ERROR 404
    </div>

    <h1>SIGNAL LOST.</h1>

    <div class="message">
      <p>
        The requested coordinate returned no carrier.
      </p>

      <p>
        No transmission was recovered from this location. <br>
        Confirm and validate query, <br>
        <strong>SYSTEM FAILURE</strong>
      </p>
    </div>

    <hr class="divider">

    <div class="status">
      STATUS&nbsp;&nbsp;&nbsp;NO RESPONSE<br>
      SIGNAL&nbsp;&nbsp;&nbsp;UNRECOVERABLE<br>
      ROUTE&nbsp;&nbsp;&nbsp;&nbsp;UNKNOWN
    </div>

    <a class="return" href="/">
      &gt; > return  <span class="cursor"></span>
    </a>

    <footer>
      starlessterminal.com
    </footer>

  </main>
</body>
</html>
