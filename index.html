<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Starless Terminal - AWAITING INPUT</title>
  <meta
    name="description"
    content="Starless Terminal — AWAITING INPUT"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #0b0d0e;
      color: #d7ded9;
      font-family:
        "Courier New",
        Courier,
        monospace;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;
      padding: 32px;
    }

    main {
      width: 100%;
      max-width: 760px;
    }

    .prompt {
      color: #6fa78a;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      color: #f1f4f2;
    }

    .tagline {
      margin: 0 0 48px;
      color: #89938d;
      line-height: 1.6;
    }

    .divider {
      border: 0;
      border-top: 1px solid #252a27;
      margin: 0 0 32px;
    }

    .projects {
      display: grid;
      gap: 24px;
    }

    .project {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 24px;
    }

    .project-name {
      color: #dbe3de;
      font-weight: bold;
    }

    .project-description {
      color: #77817b;
      line-height: 1.5;
    }

    .status {
      margin-top: 48px;
      color: #56605a;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 1em;
      background: #6fa78a;
      vertical-align: -2px;
      animation: blink 1.1s steps(1) infinite;
    }

    footer {
      margin-top: 64px;
      color: #414844;
      font-size: 0.8rem;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .project {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="prompt"></div>

    <h1>STARLESS TERMINAL</h1>

    <p class="tagline">
      projects, experiments and attempts
    </p>

    <hr class="divider">

    <section class="projects" aria-label="Projects">

      <div class="project">
        <div class="project-name">SEVASTOPOL.lab</div>
        <div class="project-description">
          homelab, virtualization and proving ground
        </div>
      </div>

      <div class="project">
        <div class="project-name">ASTER</div>
        <div class="project-description">
          local AI, system monitoring, and early warnings
        </div>
      </div>

      <div class="project">
        <div class="project-name">ANESIDORA</div>
        <div class="project-description">
          data preservation, archive, and independence
        </div>
      </div>

    </section>

    <div class="status">
      &gt; SESSION ENDED > PROCESS CONTINUES. <span class="cursor"></span>
    </div>

    <footer>
      mailto:hello@starlessterminal.com
    </footer>
  </main>
</body>
</html>
